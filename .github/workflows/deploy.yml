name: Deploy to Firebase Hosting

# Pushes to main build the client and publish it to Firebase Hosting,
# then sync the Firestore + Storage rules so uploads are permitted.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Fail fast if deploy secrets are missing
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ] && [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_JSON (or FIREBASE_TOKEN) as a repository secret, otherwise this workflow cannot deploy."
            exit 1
          fi
          echo "Deploy credentials present"

      - name: Create client/.env from repository secrets
        # client/.env is gitignored, so it never exists on the runner.
        # Without this the bundle ships with firebaseReady === false.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -euo pipefail
          cd client
          missing=""
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                   VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                   VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                   VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                   VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
                   VITE_API_URL; do
            printf '%s=%s\n' "$v" "${!v}" >> .env
          done
          echo "client/.env written from secrets"

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

      - name: Verify Firebase config landed in the bundle
        # Guards against shipping a build with firebaseReady === false, which
        # silently disables every upload on the live site.
        working-directory: client
        run: |
          set -euo pipefail
          if ! grep -rq "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" dist/assets; then
            echo "::error::Firebase project id not found in dist — uploads would be disabled."
            exit 1
          fi
          echo "Firebase config present in build output"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Write service account key
        # Preferred over the legacy FIREBASE_TOKEN: service account JSON still
        # works on projects where CI token login has been revoked.
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
            echo "Using FIREBASE_SERVICE_ACCOUNT_JSON"
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Using FIREBASE_TOKEN"
          else
            echo "::error::Add either FIREBASE_SERVICE_ACCOUNT_JSON or FIREBASE_TOKEN as a repository secret."
            exit 1
          fi

      - name: Deploy hosting, Firestore rules and Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          set -euo pipefail
          # Only point GOOGLE_APPLICATION_CREDENTIALS at a file that exists,
          # otherwise the CLI errors out before it reads FIREBASE_TOKEN.
          if [ ! -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            unset GOOGLE_APPLICATION_CREDENTIALS
            echo "No service account file — falling back to FIREBASE_TOKEN"
          fi
          firebase deploy \
            --project "${{ secrets.VITE_FIREBASE_PROJECT_ID }}" \
            --only hosting,firestore:rules,storage \
            --non-interactive